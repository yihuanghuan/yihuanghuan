name: Refresh the little repo corner

on:
  schedule:
    # Around 09:23 in Asia/Shanghai; GitHub may delay scheduled runs.
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-profile.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'

concurrency:
  group: profile-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    if: github.repository == 'yihuanghuan/yihuanghuan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check the repository updater
        run: python -m unittest discover -s tests -v
      - name: Check public repositories and releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Feed the snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: yihuanghuan
          github_token: ${{ github.token }}
          outputs: |
            assets/contribution-snake.svg?color_snake=#d57547&color_dots=#f2ede3,#e8d4ae,#dcb376,#c78b4d,#9e6337
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=#efa06d&color_dots=#302b29,#574137,#805642,#ac7650,#dca574
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-live-data
          retention-days: 1
          if-no-files-found: error
          path: |
            README.md
            data/repo-pulse.json
            data/star-history.json
            assets/contribution-snake.svg
            assets/contribution-snake-dark.svg

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Keep newer human edits
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo 'The profile changed during generation. Run the workflow again on the new commit.'
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-live-data
          path: .profile-generated
      - name: Save the fresh calendar and repo notes
        run: |
          mkdir -p assets data
          cp .profile-generated/README.md README.md
          cp .profile-generated/data/repo-pulse.json data/repo-pulse.json
          cp .profile-generated/data/star-history.json data/star-history.json
          cp .profile-generated/assets/contribution-snake.svg assets/contribution-snake.svg
          cp .profile-generated/assets/contribution-snake-dark.svg assets/contribution-snake-dark.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/repo-pulse.json data/star-history.json assets/contribution-snake.svg assets/contribution-snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Feed the snake and refresh repository notes'
            git push origin HEAD:main
          fi
